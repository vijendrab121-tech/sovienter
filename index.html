<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOVIENTER - Document Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}
h1{font-size:42px;margin:10px 0} h1 span{color:#00e676}
p{color:#aaa}
.btn{background:#00c9a7;color:#000;border:0;padding:15px 25px;font-size:19px;font-weight:bold;border-radius:10px;margin:10px;cursor:pointer;display:inline-block}
.box{background:#111;padding:20px;border-radius:15px;margin-top:20px}
img{max-width:100%;border-radius:10px;margin-top:10px}
input[type=file]{display:none}
</style>
</head>
<body>
<h1>SOVI<span>ENTER</span></h1>
<p>Document Scanner - Scan | Edit | PDF | JPG</p>
<p>100% Free | No Watermark | No Sign Up</p>
<div class="box">
  <label for="camInput" class="btn">📷 Camera Kholo</label>
  <label for="galInput" class="btn" style="background:#fff">🖼️ Gallery Se Lo</label>
  <input type="file" id="camInput" accept="image/*" capture="environment">
  <input type="file" id="galInput" accept="image/*">
  <br><br>
  <p>✅ PDF Banao | JPG Banao | WhatsApp Pe Bhejo</p>
  <img id="preview" style="display:none">
  <div id="actions" style="display:none">
    <button class="btn" onclick="downloadJPG()">⬇️ JPG Download</button>
    <button class="btn" onclick="downloadPDF()">📄 PDF Banao</button>
    <button class="btn" style="background:#25D366" onclick="shareWA()">WhatsApp Pe Bhejo</button>
  </div>
</div>
<script>
let currentImg=null;
function handleFile(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    currentImg=ev.target.result;
    const p=document.getElementById('preview');
    p.src=currentImg; p.style.display='block';
    document.getElementById('actions').style.display='block';
  };
  reader.readAsDataURL(file);
}
document.getElementById('camInput').addEventListener('change',handleFile);
document.getElementById('galInput').addEventListener('change',handleFile);
function downloadJPG(){
  if(!currentImg) return;
  const a=document.createElement('a');
  a.href=currentImg; a.download='sovienter-scan.jpg'; a.click();
}
function downloadPDF(){
  if(!currentImg) return;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.addImage(currentImg,'JPEG',10,10,190,260);
  doc.save('sovienter-scan.pdf');
}
async function shareWA(){
  if(!currentImg) return;
  try{
    const res=await fetch(currentImg);
    const blob=await res.blob();
    const file=new File([blob],'sovienter.jpg',{type:'image/jpeg'});
    if(navigator.share && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Sovienter Scan'});
    }else{ downloadJPG(); window.open('https://wa.me/?text=Sovienter%20se%20scan%20kiya','_blank'); }
  }catch(e){ downloadJPG(); }
}
</script>
</body>
</html>
